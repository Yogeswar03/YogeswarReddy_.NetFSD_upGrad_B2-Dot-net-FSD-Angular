<!DOCTYPE html>
<html>
<head>
    <title>Interactive To-Do List</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }

        .todo-container {
            width: 400px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 8px;
        }

        button {
            padding: 8px 12px;
            border: none;
            cursor: pointer;
        }

        .add-btn {
            background: #007bff;
            color: white;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        li {
            background: #e9ecef;
            padding: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 5px;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            font-size: 12px;
        }

        .counts {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="todo-container">
    <h2>To-Do List</h2>

    <div class="input-group">
        <input type="text" id="taskInput" placeholder="Enter a task">
        <button class="add-btn" id="addTask">Add</button>
    </div>

    <ul id="taskList"></ul>

    <div class="counts">
        Total Tasks: <span id="totalCount">0</span><br>
        Completed Tasks: <span id="completedCount">0</span>
    </div>
</div>

<script>
$(document).ready(function(){

    var total = 0;
    var completed = 0;

    $("#addTask").click(function(){

        var taskText = $("#taskInput").val().trim();

        if(taskText !== ""){

         
            $("#taskList").append(
                "<li>" +
                "<span class='task-text'>" + taskText + "</span>" +
                "<button class='delete-btn'>Delete</button>" +
                "</li>"
            );

            total++;
            $("#totalCount").text(total);

            $("#taskInput").val(""); 
        }
    });

   
    $("#taskList").on("click", ".task-text", function(){

        $(this).toggleClass("completed");

        if($(this).hasClass("completed")){
            completed++;
        } else {
            completed--;
        }

        $("#completedCount").text(completed);
    });

    $("#taskList").on("click", ".delete-btn", function(){

        var parentLi = $(this).parent();

        if(parentLi.find(".task-text").hasClass("completed")){
            completed--;
            $("#completedCount").text(completed);
        }

        parentLi.remove();
        total--;
        $("#totalCount").text(total);
    });

});
</script>

</body>
</html>
